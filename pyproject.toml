[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalpost-company-agent"
version = "1.0.0"
description = "Norwegian Company Research Agent"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0", "pydantic>=2.7.0", "click>=8.1.7", "rich>=13.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8.1.0", "pytest-asyncio>=0.23.0", "respx>=0.21.1"]

[tool.setuptools.packages.find]
include = ["signalpost*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
